<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SnapCal AI Debug</title>
  <style>
    body {
      margin: 0;
      padding: 16px;
      background: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.5;
    }
    h1 { font-size: 18px; margin: 0 0 12px; color: #fff; }
    .row { padding: 8px 0; border-bottom: 1px solid #1f2937; }
    .label { color: #94a3b8; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; }
    .value { color: #4ade80; word-break: break-all; }
    .value.red { color: #f87171; }
  </style>
</head>
<body>
  <h1>SnapCal AI — Telegram WebApp Debug</h1>
  <div id="output">Loading...</div>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script>
    function log(label, value, isBad) {
      const output = document.getElementById('output');
      const row = document.createElement('div');
      row.className = 'row';
      const v = value === undefined ? 'undefined' : value === null ? 'null' : String(value);
      row.innerHTML = '<div class="label">' + label + '</div><div class="value ' + (isBad ? 'red' : '') + '">' + v + '</div>';
      output.appendChild(row);
    }

    function run() {
      document.getElementById('output').innerHTML = '';

      var hasWindow = typeof window !== 'undefined';
      log('window exists', hasWindow, !hasWindow);

      var tg = window.Telegram;
      log('window.Telegram exists', !!tg, !tg);

      var webApp = tg ? tg.WebApp : undefined;
      log('window.Telegram.WebApp exists', !!webApp, !webApp);

      if (!webApp) {
        log('initData', 'N/A (no WebApp)', true);
        log('initDataUnsafe', 'N/A', true);
        return;
      }

      log('initData length', (webApp.initData || '').length, !(webApp.initData || '').length);
      log('initData first 120 chars', (webApp.initData || '').slice(0, 120), !(webApp.initData || '').length);

      var user = webApp.initDataUnsafe ? webApp.initDataUnsafe.user : undefined;
      log('user exists', !!user, !user);
      if (user) {
        log('user.id', user.id, false);
        log('user.first_name', user.first_name, false);
        log('user.username', user.username, false);
        log('user.photo_url exists', !!user.photo_url, false);
      }

      log('platform', webApp.platform, false);
      log('version', webApp.version, false);
      log('colorScheme', webApp.colorScheme, false);

      var allKeys = Object.keys(webApp).join(', ');
      log('WebApp keys', allKeys, false);

      try {
        webApp.ready();
        webApp.expand();
        log('ready() / expand() called', 'yes', false);
      } catch (e) {
        log('ready/expand error', e.message, true);
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', run);
    } else {
      run();
    }
    setTimeout(run, 1000);
  </script>
</body>
</html>
