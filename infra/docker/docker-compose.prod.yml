version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: snapcal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: snapcal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - snapcal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapcal -d snapcal"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - snapcal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    environment:
      NODE_ENV: production
      PORT: 4000
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-${DATABASE_URL}}
      DATABASE_DIRECT_URL: ${DATABASE_DIRECT_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      MOBILE_APP_URL: ${MOBILE_APP_URL}
      ADMIN_APP_URL: ${ADMIN_APP_URL}
      AI_AGENT_URL: http://ai-agent:4001
      AI_AGENT_SECRET: ${AI_AGENT_SECRET}
      AGENT_SECRET: ${AI_AGENT_SECRET}
      AI_API_KEY: ${AI_AGENT_SECRET}
    networks:
      - snapcal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ai-agent:
    build:
      context: .
      dockerfile: Dockerfile
      target: ai-agent
    environment:
      NODE_ENV: production
      PORT: 4001
      HOST: 0.0.0.0
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
      AI_AGENT_SECRET: ${AI_AGENT_SECRET}
      AGENT_SECRET: ${AI_AGENT_SECRET}
      AI_API_KEY: ${AI_AGENT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://ollama:11434}
    networks:
      - snapcal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4001/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  telegram-bot:
    build:
      context: .
      dockerfile: Dockerfile
      target: telegram-bot
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MOBILE_APP_URL: ${MOBILE_APP_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_READ_URL: ${DATABASE_READ_URL:-${DATABASE_URL}}
      REDIS_URL: ${REDIS_URL}
    networks:
      - snapcal
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  mobile:
    build:
      context: .
      dockerfile: Dockerfile
      target: mobile-static
    networks:
      - snapcal
    depends_on:
      - api

  admin:
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-static
    networks:
      - snapcal
    depends_on:
      - api

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - snapcal
    depends_on:
      - api
      - ai-agent
      - mobile
      - admin
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  snapcal:
    driver: bridge
