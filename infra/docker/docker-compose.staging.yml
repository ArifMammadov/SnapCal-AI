version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: snapcal
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapcal_staging_password}
      POSTGRES_DB: snapcal
    volumes:
      - postgres_staging_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redis_staging_data:/data

  api:
    image: ${DOCKER_REGISTRY}/snapcal-api:staging
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://snapcal:${POSTGRES_PASSWORD:-snapcal_staging_password}@postgres:5432/snapcal
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      AI_AGENT_URL: http://ai-agent:4001
    ports:
      - "5174:4000"

  ai-agent:
    image: ${DOCKER_REGISTRY}/snapcal-ai-agent:staging
    environment:
      NODE_ENV: production
      PORT: 4001
      DATABASE_URL: postgresql://snapcal:${POSTGRES_PASSWORD:-snapcal_staging_password}@postgres:5432/snapcal
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}

  telegram-bot:
    image: ${DOCKER_REGISTRY}/snapcal-telegram-bot:staging
    environment:
      NODE_ENV: production
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      MOBILE_APP_URL: http://157.230.113.0:5174
      DATABASE_URL: postgresql://snapcal:${POSTGRES_PASSWORD:-snapcal_staging_password}@postgres:5432/snapcal
      REDIS_URL: redis://redis:6379

  mobile:
    image: ${DOCKER_REGISTRY}/snapcal-mobile:staging
    ports:
      - "8083:80"

  admin:
    image: ${DOCKER_REGISTRY}/snapcal-admin:staging
    ports:
      - "8084:80"

volumes:
  postgres_staging_data:
  redis_staging_data:
