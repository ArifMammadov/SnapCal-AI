global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

rule_files:
  - '/etc/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'ai-agent'
    static_configs:
      - targets: ['ai-agent:4001']
    metrics_path: /metrics
  - job_name: 'api'
    static_configs:
      - targets: ['api:4000']
    metrics_path: /metrics
  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
