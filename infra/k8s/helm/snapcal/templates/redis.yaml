{{ if .Values.redis.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "snapcal.fullname" . }}-redis
  labels:
    {{- include "snapcal.labels" . | nindent 4 }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.redis.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "snapcal.fullname" . }}-redis
  labels:
    {{- include "snapcal.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "snapcal.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: redis
  template:
    metadata:
      labels:
        {{- include "snapcal.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: redis
    spec:
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 5
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 5
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ include "snapcal.fullname" . }}-redis
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    {{- include "snapcal.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/component: redis
    {{- include "snapcal.selectorLabels" . | nindent 4 }}
  ports:
    - port: 6379
      targetPort: 6379
{{ end }}
