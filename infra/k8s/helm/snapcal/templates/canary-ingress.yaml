{{ if .Values.canary.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "snapcal.fullname" . }}-canary
  annotations:
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: "{{ .Values.canary.weight }}"
    {{- if .Values.canary.header }}
    nginx.ingress.kubernetes.io/canary-by-header: "{{ .Values.canary.header }}"
    nginx.ingress.kubernetes.io/canary-by-header-value: "{{ .Values.canary.headerValue }}"
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.static.mobile.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "snapcal.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
{{ end }}
