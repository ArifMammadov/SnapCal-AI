server {
    server_name snapcal.health;

    root /opt/snapcal-main/apps/mobile/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /admin {
        alias /opt/snapcal-main/apps/admin/dist;
        try_files $uri $uri/ /admin/index.html;
    }

    location /api/ {
        proxy_pass http://localhost:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/snapcal.health/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/snapcal.health/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location /uploads/ {
        alias /opt/snapcal/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }
}
server {
    if ($host = snapcal.health) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name snapcal.health;
    return 404; # managed by Certbot



}
