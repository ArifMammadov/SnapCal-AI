name: Auto-rollback on Alert

on:
  repository_dispatch:
    types: [auto-rollback]
  workflow_dispatch:
    inputs:
      namespace:
        description: 'Kubernetes namespace'
        required: true
        default: 'snapcal'
      release:
        description: 'Helm release name'
        required: true
        default: 'snapcal'
      revision:
        description: 'Revision to rollback to (0 = previous)'
        required: true
        default: '0'

jobs:
  rollback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Helm
        uses: azure/setup-helm@v4
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
      - name: Rollback
        env:
          NAMESPACE: ${{ github.event.inputs.namespace || 'snapcal' }}
          RELEASE: ${{ github.event.inputs.release || 'snapcal' }}
          REVISION: ${{ github.event.inputs.revision || '0' }}
        run: |
          ./scripts/auto-rollback.sh "$NAMESPACE" "$RELEASE" "$REVISION"
