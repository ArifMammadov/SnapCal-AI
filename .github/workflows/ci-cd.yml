name: CI/CD

on:
  push:
    branches: [main, preprod, test, develop, admin]
  pull_request:
    branches: [main, preprod, develop]

env:
  NODE_VERSION: '22'

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @snapcal/database generate

      - name: Type check
        run: pnpm typecheck

      - name: Build packages
        run: |
          pnpm --filter @snapcal/database generate
          pnpm --filter @snapcal/database build
          pnpm --filter @snapcal/shared build
          pnpm --filter @snapcal/api build
          pnpm --filter @snapcal/admin build
          pnpm --filter @snapcal/mobile build

  deploy-test:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.ref == 'refs/heads/test'
    environment:
      name: test
      url: https://test.snapcal.health
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to test server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/snapcal-test
            git fetch origin
            git checkout -f test
            git reset --hard origin/test
            pnpm install
            cd /opt/snapcal-test/packages/database && pnpm generate
            cd /opt/snapcal-test/apps/api && pnpm build
            cd /opt/snapcal-test/apps/admin && pnpm build
            cd /opt/snapcal-test/apps/mobile && pnpm build
            systemctl --user restart snapcal-api-test
            echo "Test deploy done"

  deploy-preprod:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.ref == 'refs/heads/preprod'
    environment:
      name: preprod
      url: https://preprod.snapcal.health
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to preprod server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/snapcal-preprod
            git fetch origin
            git checkout -f preprod
            git reset --hard origin/preprod
            pnpm install
            cd /opt/snapcal-preprod/packages/database && pnpm generate
            cd /opt/snapcal-preprod/apps/api && pnpm build
            cd /opt/snapcal-preprod/apps/admin && pnpm build
            cd /opt/snapcal-preprod/apps/mobile && pnpm build
            systemctl --user restart snapcal-api-preprod
            echo "Preprod deploy done"

  deploy-main:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://snapcal.health
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/snapcal-main
            git fetch origin
            git checkout -f main
            git reset --hard origin/main
            pnpm install
            cd /opt/snapcal-main/packages/database && pnpm generate
            cd /opt/snapcal-main/apps/api && pnpm build
            cd /opt/snapcal-main/apps/admin && pnpm build
            cd /opt/snapcal-main/apps/mobile && pnpm build
            systemctl --user restart snapcal-api-main
            echo "Production deploy done"

  deploy-admin:
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    if: github.ref == 'refs/heads/admin'
    environment:
      name: admin
      url: https://admin.snapcal.health
    steps:
      - uses: actions/checkout@v4

      - name: Deploy admin panel
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.DO_PROD_SSH_KEY }}
          script: |
            set -e
            cd /opt/snapcal-admin
            git fetch origin
            git checkout -f admin
            git reset --hard origin/admin
            pnpm install
            cd /opt/snapcal-admin/packages/database && pnpm generate
            cd /opt/snapcal-admin/apps/api && pnpm build
            cd /opt/snapcal-admin/apps/admin && pnpm build
            systemctl --user restart snapcal-api-admin
            echo "Admin deploy done"
